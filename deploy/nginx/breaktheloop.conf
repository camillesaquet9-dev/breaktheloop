# /etc/nginx/sites-available/breaktheloop.conf
# After editing: sudo nginx -t && sudo systemctl reload nginx

# 80 -> 443 redirect (certbot will manage the TLS portion automatically).
server {
    listen 80;
    listen [::]:80;
    server_name breaktheloop.fr www.breaktheloop.fr;
    return 301 https://breaktheloop.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.breaktheloop.fr;

    ssl_certificate     /etc/letsencrypt/live/breaktheloop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breaktheloop.fr/privkey.pem;

    return 301 https://breaktheloop.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name breaktheloop.fr;

    ssl_certificate     /etc/letsencrypt/live/breaktheloop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breaktheloop.fr/privkey.pem;

    # Modern TLS profile (auto-managed by certbot if you ran the nginx plugin)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Reasonable hard limits (prevent abusive bodies; APIs cap at 8KB JSON).
    client_max_body_size 32k;

    # Forward real client IP to Next.js so rate-limit + ip-hash work.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Static assets straight from Next's build output (gzipped, immutable hashes).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;     # SSE-friendly + low TTFB
        proxy_read_timeout 60s;  # LLM calls cap at 15s, leave headroom
    }
}
