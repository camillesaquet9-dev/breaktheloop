version: 2
updates:
  # JavaScript / npm packages (pnpm works via the npm ecosystem key).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      # Keep framework + typing updates grouped so one PR covers the ecosystem.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tooling:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/test"
      supabase:
        patterns:
          - "@supabase/*"
          - "supabase"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # GitHub Actions themselves — pin to SHAs, let dependabot bump to new SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
